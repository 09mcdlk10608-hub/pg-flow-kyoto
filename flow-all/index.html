<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VG診断</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding: 16px;
}

h2 {
  margin: 12px 0;
}

button {
  display: block;
  margin: 8px auto;
  padding: 14px;
  width: 90%;
  max-width: 320px;
  font-size: 14px;
}

/* 補助ボタン */
.reset-btn {
  background: none;
  border: none;
  color: #555;
  text-decoration: underline;
  margin-top: 20px;
}

.top-btn {
  background: #555;
  color: #fff;
  border: none;
  padding: 10px 16px;
  width: auto;
  display: inline-block;
  margin-top: 30px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

// ===== 質問データ（新構造） =====
const questions = [

  // Q1
  {
    q: "映像の軸はどちらが近い？",
    a: [
      { text: "感動・ストーリー性", next: 1 },
      { text: "楽しさ・雰囲気", next: 2 }
    ]
  },

  // Q2
  {
    q: "どんなテイストにしたい？",
    a: [
      { text: "シネマティック・エモい", next: 3 },
      { text: "ナチュラル・明るい", next: 4 }
    ]
  },

  // Q3
  {
    q: "どんなVGがいい？",
    a: [
      { text: "落ち着いて見守る", next: 3 },
      { text: "一緒に楽しむ", next: 4 }
    ]
  },

  // Q4 → Q6/Q7
  {
    q: "映像へのこだわりは？",
    a: [
      { text: "世界観や演出をしっかり作り込みたい", next: 5 },
      { text: "自然さも残しつつ綺麗にまとめたい", next: 6 }
    ]
  },

  // Q5 → Q8/Q9
  {
    q: "当日の過ごし方の理想は？",
    a: [
      { text: "落ち着いた空気でゆったり過ごしたい", next: 7 },
      { text: "みんなで楽しくワイワイ過ごしたい", next: 8 }
    ]
  },

  // ===== Q6 =====
  {
    q: "どちらの型がお好み？",
    a: [
      { text: "シネマティック没入型", result: "A" },
      { text: "ナチュラルストーリー型", result: "B" }
    ]
  },

  // ===== Q7 =====
  {
    q: "どちらの型がお好み？",
    a: [
      { text: "ドキュメンタリー空気型", result: "C" },
      { text: "エンタメ盛り上げ型", result: "D" }
    ]
  },

  // ===== Q8 =====
  {
    q: "どちらの型がお好み？",
    a: [
      { text: "シネマティック没入型", result: "A" },
      { text: "ドキュメンタリー空気型", result: "C" }
    ]
  },

  // ===== Q9 =====
  {
    q: "どちらの型がお好み？",
    a: [
      { text: "ナチュラルストーリー型", result: "B" },
      { text: "エンタメ盛り上げ型", result: "D" }
    ]
  }
];

// ===== 結果 =====
const results = {
  A:{title:"シネマティック没入型",members:["takeki","hissan","Tokky","kose"]},
  B:{title:"ナチュラルストーリー型",members:["kazuma","anri"]},
  C:{title:"ドキュメンタリー空気型",members:["Ryo","tamo","zono","kira"]},
  D:{title:"エンタメ盛り上げ型",members:["naoki","meisei"]}
};

// ===== URL =====
const urlMap = {
  "takeki":"https://www.la-viephoto.com/photo_g/takeki-vg",
  "hissan":"https://www.la-viephoto.com/photo_g/hissan-vg",
  "Tokky":"https://www.la-viephoto.com/photo_g/tokky-vg",
  "kose":"https://www.la-viephoto.com/photo_g/kose",
  "kazuma":"https://www.la-viephoto.com/photo_g/kazuma-vg",
  "anri":"https://www.la-viephoto.com/photo_g/anri",
  "Ryo":"https://www.la-viephoto.com/photo_g/ryo-vg",
  "tamo":"https://www.la-viephoto.com/photo_g/tamo-vg",
  "zono":"https://www.la-viephoto.com/photo_g/zono-vg",
  "kira":"https://www.la-viephoto.com/photo_g/kira",
  "naoki":"https://www.la-viephoto.com/photo_g/naoki",
  "meisei":""
};

// ===== 表示 =====
function showQuestion(i){
  const app=document.getElementById("app");
  const q=questions[i];

  app.innerHTML="<h2>"+q.q+"</h2>";

  q.a.forEach(choice=>{
    const btn=document.createElement("button");
    btn.textContent=choice.text;

    btn.onclick=()=>{
      if(choice.next!==undefined){
        showQuestion(choice.next);
      }else{
        showResult(choice.result);
      }
    };

    app.appendChild(btn);
  });

  const reset=document.createElement("button");
  reset.textContent="↺ 最初に戻る";
  reset.className="reset-btn";
  reset.onclick=()=>location.reload();
  app.appendChild(reset);

  if(i===0){
    const top=document.createElement("button");
    top.textContent="← PG / VG選択に戻る";
    top.className="top-btn";
    top.onclick=()=>location.href="../select/";
    app.appendChild(top);
  }
}

// ===== 結果表示 =====
function showResult(key){
  const app=document.getElementById("app");
  const data=results[key];

  app.innerHTML="<h2>"+data.title+"</h2>";

  data.members.forEach(name=>{
    const div=document.createElement("div");

    if(urlMap[name]){
      const a=document.createElement("a");
      a.textContent=name;
      a.href=urlMap[name];
      a.target="_blank";
      div.appendChild(a);
    }else{
      div.textContent=name;
    }

    app.appendChild(div);
  });

  const reset=document.createElement("button");
  reset.textContent="↺ 最初に戻る";
  reset.className="reset-btn";
  reset.onclick=()=>location.reload();
  app.appendChild(reset);

  const top=document.createElement("button");
  top.textContent="← PG / VG選択に戻る";
  top.className="top-btn";
  top.onclick=()=>location.href="../select/";
  app.appendChild(top);
}

// 初期表示
showQuestion(0);

</script>

</body>
</html>
