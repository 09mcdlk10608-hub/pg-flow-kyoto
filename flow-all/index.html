<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VG診断</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding: 16px;
  line-height: 1.5;
}

h2 {
  margin: 10px 0;
  font-size: 20px;
}

.catch {
  margin: 0 0 16px;
  font-size: 14px;
  color: #666;
}

button {
  display: block;
  margin: 8px auto;
  padding: 12px;
  font-size: 14px;
  width: 90%;
  max-width: 300px;
}

.reset-btn {
  margin-top: 20px;
  background: none;
  color: #555;
  border: none;
  width: auto;
  padding: 0;
  text-decoration: underline;
}

.top-btn {
  margin-top: 30px;
  background: #555;
  color: #fff;
  border: none;
  width: auto;
  padding: 10px 16px;
  display: inline-block;
}

.toggle {
  margin: 20px 0 10px;
  font-weight: bold;
  cursor: pointer;
}

.hidden {
  display: none;
}

.member {
  margin: 4px 0;
}

#detail p {
  margin: 0;
}

#detail {
  font-size: 14px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
// ===== 質問 =====
const questions = [
  {
    q: "映像の軸はどちらが近い？",
    a: [
      { text: "感動・ストーリー性", next: 1 },
      { text: "楽しさ・雰囲気", next: 2 }
    ]
  },
  {
    q: "どんなテイストにしたい？",
    a: [
      { text: "シネマティック・エモい", next: 3 },
      { text: "ナチュラル・明るい", next: 4 }
    ]
  },
  {
    q: "どんなVGがいい？",
    a: [
      { text: "落ち着いて見守る", next: 3 },
      { text: "一緒に楽しむ", next: 4 }
    ]
  },
  {
    q: "映像へのこだわりは？",
    a: [
      { text: "しっかり作り込む", result: ["A","B"] },
      { text: "自然さも大切", result: ["C","D"] }
    ]
  },
  {
    q: "理想の過ごし方は？",
    a: [
      { text: "ゆったり", result: ["A","C"] },
      { text: "ワイワイ", result: ["B","D"] }
    ]
  }
];

// ===== 結果 =====
const results = {
  A: {
    title: "シネマティック没入型",
    catch: "― 映画のような世界観に浸りたいあなたへ ―",
    text: "映像の流れや演出を大切にしたい。<br>落ち着いた空気で作品として残したい方。",
    members: ["takeki","hissan","Tokky","kose"]
  },
  B: {
    title: "ナチュラルストーリー型",
    catch: "― 自然な感情と楽しさをそのまま残したいあなたへ ―",
    text: "自然な一日を残したい。<br>明るさと感動を大切にしたい方。",
    members: ["kazuma","anri"]
  },
  C: {
    title: "ドキュメンタリー空気型",
    catch: "― 当日の空気感をありのまま残したいあなたへ ―",
    text: "その場の雰囲気を自然に残したい。<br>思い出をそのまま残したい方。",
    members: ["Ryo","tamo","zono","kira"]
  },
  D: {
    title: "エンタメ盛り上げ型",
    catch: "― みんなで楽しむ一日を全力で残したいあなたへ ―",
    text: "楽しい空気や一体感を残したい。<br>盛り上がり重視で記録したい方。",
    members: ["naoki","meisei"]
  }
};

// ===== URL =====
const urlMap = {
  "takeki": "https://www.la-viephoto.com/photo_g/takeki-vg",
  "hissan": "https://www.la-viephoto.com/photo_g/hissan-vg",
  "Tokky": "https://www.la-viephoto.com/photo_g/tokky-vg",
  "kose": "https://www.la-viephoto.com/photo_g/kose",
  "kazuma": "https://www.la-viephoto.com/photo_g/kazuma-vg",
  "anri": "https://www.la-viephoto.com/photo_g/anri",
  "Ryo": "https://www.la-viephoto.com/photo_g/ryo-vg",
  "tamo": "https://www.la-viephoto.com/photo_g/tamo-vg",
  "zono": "https://www.la-viephoto.com/photo_g/zono-vg",
  "kira": "https://www.la-viephoto.com/photo_g/kira",
  "naoki": "https://www.la-viephoto.com/photo_g/naoki",
  "meisei": ""
};

let answers = [];

// ===== 質問表示 =====
function showQuestion(i) {
  const app = document.getElementById("app");
  const q = questions[i];

  app.innerHTML = "<h2>" + q.q + "</h2>";

  q.a.forEach(choice => {
    const btn = document.createElement("button");
    btn.textContent = choice.text;

    btn.onclick = function() {
      if (choice.next !== undefined) {
        showQuestion(choice.next);
      } else {
        answers = [choice.result]; // ✅ ここ重要（1回で確定）
        showResult();
      }
    };

    app.appendChild(btn);
  });

  const resetBtn = document.createElement("button");
  resetBtn.textContent = "↺ 最初に戻る";
  resetBtn.className = "reset-btn";
  resetBtn.onclick = function() {
    showQuestion(0);
  };
  app.appendChild(resetBtn);

  if (i === 0) {
    const topBtn = document.createElement("button");
    topBtn.textContent = "← PG / VG選択に戻る";
    topBtn.className = "top-btn";
    topBtn.onclick = function() {
      location.href = "../select/";
    };
    app.appendChild(topBtn);
  }
}

// ===== 結果表示 =====
function showResult() {
  const list = answers[0];

  // ランダムではなく先頭要素固定 → 安定表示
  const final = list[0];

  const data = results[final];
  const app = document.getElementById("app");

  app.innerHTML =
    "<h2>" + data.title + "</h2>" +
    "<div class='catch'>" + data.catch + "</div>" +
    "<div class='toggle' onclick='toggleText()'>▷ こんなあなたにおすすめ（←ここをタップ）</div>" +
    "<div id='detail' class='hidden'><p>" + data.text + "</p></div>" +
    "<h3>おすすめVG</h3>";

  data.members.forEach(name => {
    const wrapper = document.createElement("div");
    wrapper.className = "member";

    if (urlMap[name]) {
      const link = document.createElement("a");
      link.textContent = name;
      link.href = urlMap[name];
      link.target = "_blank";
      wrapper.appendChild(link);
    } else {
      wrapper.textContent = name;
    }

    app.appendChild(wrapper);
  });

  const resetBtn = document.createElement("button");
  resetBtn.textContent = "↺ 最初に戻る";
  resetBtn.className = "reset-btn";
  resetBtn.onclick = function() {
    showQuestion(0);
  };
  app.appendChild(resetBtn);

  const topBtn = document.createElement("button");
  topBtn.textContent = "← PG / VG選択に戻る";
  topBtn.className = "top-btn";
  topBtn.onclick = function() {
    location.href = "../select/";
  };
  app.appendChild(topBtn);
}

// ===== トグル =====
function toggleText() {
  const el = document.getElementById("detail");
  const toggle = document.querySelector(".toggle");

  if (el.classList.contains("hidden")) {
    el.classList.remove("hidden");
    toggle.textContent = "▼ こんなあなたにおすすめ（←閉じる）";
  } else {
    el.classList.add("hidden");
    toggle.textContent = "▷ こんなあなたにおすすめ（←ここをタップ）";
  }
}

showQuestion(0);
</script>

</body>
</html>
