<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VG診断</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  padding:16px;
}

button{
  display:block;
  margin:8px auto;
  padding:12px;
  width:90%;
  max-width:300px;
}

/* リセット */
.reset-btn{
  background:none;
  border:none;
  color:#555;
  text-decoration:underline;
}

/* TOP戻る */
.top-btn{
  margin-top:20px;
  background:#555;
  color:#fff;
  border:none;
  padding:10px 16px;
  width:auto;
}

/* トグル */
.hidden{display:none;}
</style>
</head>

<body>

<div id="app"></div>

<script>

let base=null;

// ===== 質問 =====
const questions=[

{q:"映像の軸はどちらが近い？",
 a:[
  {text:"感動・ストーリー性",next:1},
  {text:"楽しさ・雰囲気",next:2}
 ]},

{q:"どんなテイストにしたい？",
 a:[
  {text:"シネマティック",next:3,set:"A"},
  {text:"ナチュラル",next:4,set:"C"}
 ]},

{q:"どんなVGがいい？",
 a:[
  {text:"落ち着いて見守る",next:3,set:"A"},
  {text:"一緒に楽しむ",next:4,set:"B"}
 ]},

// ===== Q4 =====
{q:"映像へのこだわりは？",
 a:[
  {text:"しっかり作り込む",result:"Q4A"},
  {text:"自然さも大切",result:"Q4B"}
 ]},

// ===== Q5 =====
{q:"理想の過ごし方は？",
 a:[
  {text:"ゆったり",result:"Q5A"},
  {text:"ワイワイ",result:"Q5B"}
 ]}
];

// ===== 結果 =====
const results={
A:{title:"シネマティック没入型",members:["takeki","hissan","Tokky","kose"]},
B:{title:"ナチュラルストーリー型",members:["kazuma","anri"]},
C:{title:"ドキュメンタリー空気型",members:["Ryo","tamo","zono","kira"]},
D:{title:"エンタメ盛り上げ型",members:["naoki","meisei"]}
};

// ===== 表示 =====
function showQuestion(i){

const app=document.getElementById("app");
const q=questions[i];

app.innerHTML="<h2>"+q.q+"</h2>";

q.a.forEach(choice=>{
const btn=document.createElement("button");
btn.textContent=choice.text;

btn.onclick=()=>{

if(choice.set){base=choice.set;}

if(choice.next!==undefined){
showQuestion(choice.next);
}else{
decide(choice.result);
}

};

app.appendChild(btn);
});

// 戻る
const reset=document.createElement("button");
reset.textContent="↺ 最初に戻る";
reset.className="reset-btn";
reset.onclick=()=>location.reload();
app.appendChild(reset);

if(i===0){
const top=document.createElement("button");
top.textContent="← PG / VG選択に戻る";
top.className="top-btn";
top.onclick=()=>location.href="../select/";
app.appendChild(top);
}

}

// ===== 判定 =====
function decide(type){

let final;

if(type==="Q4A"){
final = (base==="A") ? "A" : "B";
}

if(type==="Q4B"){
final = (base==="C") ? "C" : "D";
}

if(type==="Q5A"){
final = (base==="A") ? "A" : "C";
}

if(type==="Q5B"){
final = (base==="B") ? "B" : "D";
}

showResult(final);
}

// ===== 結果 =====
function showResult(key){

const app=document.getElementById("app");
const data=results[key];

app.innerHTML="<h2>"+data.title+"</h2>";

data.members.forEach(n=>{
const d=document.createElement("div");
d.textContent=n;
app.appendChild(d);
});

const reset=document.createElement("button");
reset.textContent="↺ 最初に戻る";
reset.onclick=()=>location.reload();
app.appendChild(reset);

const top=document.createElement("button");
top.textContent="← PG / VG選択に戻る";
top.className="top-btn";
top.onclick=()=>location.href="../select/";
app.appendChild(top);
}

showQuestion(0);

</script>
</body>
</html>
