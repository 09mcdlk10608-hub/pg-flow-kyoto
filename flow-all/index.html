<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VG診断</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding: 20px;
}
button {
  display: block;
  margin: 10px auto;
  padding: 12px 20px;
}
.hidden {
  display: none;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
let answers = [];

// ===== 質問 =====
const questions = [
  {
    q: "映像の軸はどちらが近い？",
    a: [
      { text: "感動・ストーリー性", next: 1 },
      { text: "楽しさ・雰囲気", next: 2 }
    ]
  },
  {
    q: "どんなテイストにしたい？",
    a: [
      { text: "シネマティック・エモい", next: 3 },
      { text: "ナチュラル・明るい", next: 4 }
    ]
  },
  {
    q: "どんなVGがいい？",
    a: [
      { text: "落ち着いて見守る", next: 3 },
      { text: "一緒に楽しむ", next: 4 }
    ]
  },
  {
    q: "映像へのこだわりは？",
    a: [
      { text: "しっかり作り込む", result: ["A","B"] },
      { text: "自然さも大切", result: ["C","D"] }
    ]
  },
  {
    q: "理想の過ごし方は？",
    a: [
      { text: "ゆったり", result: ["A","D"] },
      { text: "ワイワイ", result: ["B","D"] }
    ]
  }
];

// ===== 結果 =====
const results = {
  A: {
    title: "シネマティック没入型",
    text: ["映画のような世界観を大切に", "落ち着いた空気感で撮影したい方"],
    members: ["takeki","hissan","Tokky","kose"]
  },
  B: {
    title: "ナチュラルストーリー型",
    text: ["自然な感情を大切に", "楽しさと感動のバランス重視"],
    members: ["kazuma","anri"]
  },
  C: {
    title: "ドキュメンタリー空気型",
    text: ["ありのままの空気を残す", "ナチュラルに記録したい方"],
    members: ["Ryo","tamo","zono","kira"]
  },
  D: {
    title: "エンタメ盛り上げ型",
    text: ["ワイワワイ楽しく", "一体感を大切に"],
    members: ["naoki","meisei"]
  }
};

// ===== 質問表示 =====
function showQuestion(i) {
  const q = questions[i];
  const app = document.getElementById("app");
  app.innerHTML = "<h2>"+q.q+"</h2>";

  q.a.forEach(choice=>{
    const btn = document.createElement("button");
    btn.textContent = choice.text;

    btn.onclick = ()=>{
      if (choice.next !== undefined) {
        showQuestion(choice.next);
      } else {
        answers.push(choice.result);
        showResult();
      }
    };

    app.appendChild(btn);
  });

  // ↓最初に戻る
  const back = document.createElement("button");
  back.textContent = "↺ 最初に戻る";
  back.onclick = ()=> showQuestion(0);
  app.appendChild(back);

  // ↓TOPに戻る（追加）
  const topBtn = document.createElement("button");
  topBtn.textContent = "← TOPに戻る";
  topBtn.onclick = ()=> location.href = "../select/";
  app.appendChild(topBtn);
}

// ===== 結果表示 =====
function showResult() {
  const r = answers[0][0];
  const data = results[r];

  const app = document.getElementById("app");
  app.innerHTML = "<h2>"+data.title+"</h2>";

  data.text.forEach(t=>{
    const p = document.createElement("p");
    p.textContent = t;
    app.appendChild(p);
  });

  data.members.forEach(name=>{
    const div = document.createElement("div");
    div.textContent = name;
    app.appendChild(div);
  });

  // ↓最初に戻る
  const back = document.createElement("button");
  back.textContent = "↺ 最初に戻る";
  back.onclick = ()=> showQuestion(0);
  app.appendChild(back);

  // ↓TOPに戻る（追加）
  const topBtn = document.createElement("button");
  topBtn.textContent = "← TOPに戻る";
  topBtn.onclick = ()=> location.href = "../select/";
  app.appendChild(topBtn);
}

// 初期表示
showQuestion(0);
</script>

</body>
</html>
