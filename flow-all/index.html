<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VG診断</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding: 20px;
  line-height: 1.6;
}

h2 {
  margin-bottom: 10px;
}

.catch {
  margin-bottom: 20px;
  color: #555;
}

button {
  display: block;
  margin: 10px auto;
  padding: 12px 20px;
  font-size: 15px;
}

.toggle {
  margin: 20px 0 10px;
  font-weight: bold;
  cursor: pointer;
}

.hidden {
  display: none;
}

.member {
  margin: 5px 0;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
let answers = [];

// ===== 質問 =====
const questions = [
  {
    q: "映像の軸はどちらが近い？",
    a: [
      { text: "感動・ストーリー性", next: 1 },
      { text: "楽しさ・雰囲気", next: 2 }
    ]
  },
  {
    q: "どんなテイストにしたい？",
    a: [
      { text: "シネマティック・エモい", next: 3 },
      { text: "ナチュラル・明るい", next: 4 }
    ]
  },
  {
    q: "どんなVGがいい？",
    a: [
      { text: "落ち着いて見守る", next: 3 },
      { text: "一緒に楽しむ", next: 4 }
    ]
  },
  {
    q: "映像へのこだわりは？",
    a: [
      { text: "しっかり作り込む", result: ["A","B"] },
      { text: "自然さも大切", result: ["C","D"] }
    ]
  },
  {
    q: "理想の過ごし方は？",
    a: [
      { text: "ゆったり", result: ["A","D"] },
      { text: "ワイワイ", result: ["B","D"] }
    ]
  }
];

// ===== 結果（本番版）=====
const results = {
  A: {
    title: "シネマティック没入型",
    catch: "― 映画のような世界観に浸りたいあなたへ ―",
text: "映像の流れや演出を大切にし、感情まで丁寧に残したい。<br>落ち着いた空気感の中で、一本の作品として結婚式を記録したい方。"
``
    members: ["takeki","hissan","Tokky","kose"]
  },
  B: {
    title: "ナチュラルストーリー型",
    catch: "― 自然な感情と楽しさをそのまま残したいあなたへ ―",
    text: [
      "作り込みすぎず、その日の出来事や想いをやさしく映像に残したい。",
      "明るさも感動も、バランスよく楽しみたい方。"
    ],
    members: ["kazuma","anri"]
  },
  C: {
    title: "ドキュメンタリー空気型",
    catch: "― 当日の空気感をありのまま残したいあなたへ ―",
    text: [
      "演出よりも、その場に流れていた本物の雰囲気を大切にしたい。",
      "後から見返したとき、自然に思い出がよみがえる映像が理想の方。"
    ],
    members: ["Ryo","tamo","zono","kira"]
  },
  D: {
    title: "エンタメ盛り上げ型",
    catch: "― みんなで楽しむ一日を全力で残したいあなたへ ―",
    text: [
      "ゲストとの一体感や盛り上がりを、楽しくテンポよく残したい。",
      "ビデオグラファーにも一緒に空気を楽しんでほしい方。"
    ],
    members: ["naoki","meisei"]
  }
};

// ===== 質問表示 =====
function showQuestion(i) {
  const q = questions[i];
  const app = document.getElementById("app");

  app.innerHTML = "<h2>"+q.q+"</h2>";

  q.a.forEach(choice=>{
    const btn = document.createElement("button");
    btn.textContent = choice.text;

    btn.onclick = ()=>{
      if (choice.next !== undefined) {
        showQuestion(choice.next);
      } else {
        answers.push(choice.result);
        showResult();
      }
    };

    app.appendChild(btn);
  });

  const back = document.createElement("button");
  back.textContent = "↺ 最初に戻る";
  back.onclick = ()=> showQuestion(0);
  app.appendChild(back);

  if (i === 0) {
    const topBtn = document.createElement("button");
    topBtn.textContent = "← PG / VG選択に戻る";
    topBtn.onclick = ()=> location.href = "../select/";
    app.appendChild(topBtn);
  }
}

// ===== 結果表示 =====
function showResult() {
  const r = answers[0][0];
  const data = results[r];
  const app = document.getElementById("app");

  app.innerHTML = `
    <h2>${data.title}</h2>
    <div class="catch">${data.catch}</div>

    <div class="toggle" onclick="toggleText()">
      ▷ こんなあなたにおすすめ（←ここをタップ）
    </div>

<div id="detail" class="hidden">
  <p>${data.text}</p>
</div>

    <h3>おすすめVG</h3>
  `;

  data.members.forEach(name=>{
    const div = document.createElement("div");
    div.className = "member";
    div.textContent = name;
    app.appendChild(div);
  });

  const back = document.createElement("button");
  back.textContent = "↺ 最初に戻る";
  back.onclick = ()=> showQuestion(0);
  app.appendChild(back);

  const topBtn = document.createElement("button");
  topBtn.textContent = "← PG / VG選択に戻る";
  topBtn.onclick = ()=> location.href = "../select/";
  app.appendChild(topBtn);
}

// ===== 開閉 =====
function toggleText() {
  const el = document.getElementById("detail");
  const toggle = document.querySelector(".toggle");

  if (el.classList.contains("hidden")) {
    el.classList.remove("hidden");
    toggle.textContent = "▼ こんなあなたにおすすめ（←閉じる）";
  } else {
    el.classList.add("hidden");
    toggle.textContent = "▷ こんなあなたにおすすめ（←ここをタップ）";
  }
}

// 初期
showQuestion(0);
</script>

</body>
</html>
