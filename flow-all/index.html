<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VG診断</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding: 16px;
  line-height: 1.5;
}

h2 {
  margin: 10px 0;
  font-size: 20px;
}

.catch {
  margin: 0 0 16px;
  font-size: 14px;
  color: #666;
}

button {
  display: block;
  margin: 8px auto;
  padding: 12px;
  font-size: 14px;
  width: 90%;
  max-width: 300px;
}

/* ✅ 最初に戻るボタン */
.reset-btn {
  margin-top: 20px;
}

/* ✅ PG/VG戻るボタン */
.top-btn {
  margin-top: 30px;   /* ← 距離を空ける（重要） */
  background: #555;
  color: #fff;
  border: none;
}

/* ✅ こんなあなた */
.toggle {
  margin: 20px 0 10px;
  font-weight: bold;
  cursor: pointer;
}

.hidden {
  display: none;
}

.member {
  margin: 4px 0;
}

/* ✅ 行の詰め */
#detail p {
  margin: 0;
}

/* ✅ SE対策（文字ちょい詰め） */
#detail {
  font-size: 14px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
let answers = [];

// 質問
const questions = [
  { q: "映像の軸はどちらが近い？", a: [
    { text: "感動・ストーリー性", next: 1 },
    { text: "楽しさ・雰囲気", next: 2 }
  ]},
  { q: "どんなテイストにしたい？", a: [
    { text: "シネマティック・エモい", next: 3 },
    { text: "ナチュラル・明るい", next: 4 }
  ]},
  { q: "どんなVGがいい？", a: [
    { text: "落ち着いて見守る", next: 3 },
    { text: "一緒に楽しむ", next: 4 }
  ]},
  { q: "映像へのこだわりは？", a: [
    { text: "しっかり作り込む", result: "A" },
    { text: "自然さも大切", result: "C" }
  ]},
  { q: "理想の過ごし方は？", a: [
    { text: "ゆったり", result: "A" },
    { text: "ワイワイ", result: "B" }
  ]}
];

// 結果
const results = {
  A: {
    title: "シネマティック没入型",
    catch: "― 映画のような世界観に浸りたいあなたへ ―",
    text: "映像の流れや演出を大切にしたい。<br>落ち着いた空気で作品として残したい方。",
    members: ["takeki","hissan","Tokky","kose"]
  },
  B: {
    title: "ナチュラルストーリー型",
    catch: "― 自然な感情と楽しさをそのまま残したいあなたへ ―",
    text: "作り込みすぎず自然な一日を残したい。<br>明るさも感動もバランスよく楽しみたい方。",
    members: ["kazuma","anri"]
  },
  C: {
    title: "ドキュメンタリー空気型",
    catch: "― 当日の空気感をありのまま残したいあなたへ ―",
    text: "その場の雰囲気を自然に残したい。<br>あとから思い出がよみがえる映像が理想の方。",
    members: ["Ryo","tamo","zono","kira"]
  }
};

function showQuestion(i) {
  const q = questions[i];
  const app = document.getElementById("app");

  app.innerHTML = "<h2>" + q.q + "</h2>";

  q.a.forEach(choice => {
    const btn = document.createElement("button");
    btn.textContent = choice.text;

    btn.onclick = () => {
      if (choice.next !== undefined) {
        showQuestion(choice.next);
      } else {
        showResult(choice.result);
      }
    };

    app.appendChild(btn);
  });

  const back = document.createElement("button");
  back.textContent = "↺ 最初に戻る";
  back.onclick = () => showQuestion(0);
  app.appendChild(back);

  if (i === 0) {
    const topBtn = document.createElement("button");
    topBtn.textContent = "← PG / VG選択に戻る";
    topBtn.onclick = () => location.href = "../select/";
    app.appendChild(topBtn);
  }
}

function showResult(key) {
  const data = results[key];
  const app = document.getElementById("app");

  app.innerHTML = `
    <h2>${data.title}</h2>
    <div class="catch">${data.catch}</div>

    <div class="toggle" onclick="toggleText()">
      ▷ こんなあなたにおすすめ（←ここをタップ）
    </div>

    <div id="detail" class="hidden">
      <p>${data.text}</p>
    </div>

    <h3>おすすめVG</h3>
  `;

  data.members.forEach(name => {
    const div = document.createElement("div");
    div.className = "member";
    div.textContent = name;
    app.appendChild(div);
  });

  const back = document.createElement("button");
  back.textContent = "↺ 最初に戻る";
  back.onclick = () => showQuestion(0);
  app.appendChild(back);

  const topBtn = document.createElement("button");
  topBtn.textContent = "← PG / VG選択に戻る";
  topBtn.onclick = () => location.href = "../select/";
  app.appendChild(topBtn);
}

function toggleText() {
  const el = document.getElementById("detail");
  const toggle = document.querySelector(".toggle");

  if (el.classList.contains("hidden")) {
    el.classList.remove("hidden");
    toggle.textContent = "▼ こんなあなたにおすすめ（←閉じる）";
  } else {
    el.classList.add("hidden");
    toggle.textContent = "▷ こんなあなたにおすすめ（←ここをタップ）";
  }
}

showQuestion(0);
</script>

</body>
</html>
